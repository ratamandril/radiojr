name: Grabar Radio JR

on:
  schedule:
    # 18:10 UTC equivale a la 1:10 PM en hora de Perú (UTC-5)
    - cron: '10 18 * * *'
  workflow_dispatch:

jobs:
  grabar-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Grabar radio durante 60 segundos
        run: |
          FECHA=$(TZ="America/Lima" date +"%Y-%m-%d_%H-%M")
          ffmpeg -y -i "http://tupanel.info/stream/radiojr/stream" -t 60 -c copy "radiojr_${FECHA}.aac"

      - name: Guardar grabación como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grabacion-radiojr-${{ github.run_number }}
          path: radiojr_*.aac
          retention-days: 7
